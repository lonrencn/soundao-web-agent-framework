<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soundao 本地 Agent 入口</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212b;
        --muted: #5d6b7a;
        --line: #d7dee8;
        --soft: #f6f8fb;
        --blue: #1d4ed8;
        --green: #067647;
        --red: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #ffffff;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }
      header {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
        gap: 28px;
        align-items: start;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 32px;
        line-height: 1.15;
      }
      h2 {
        margin: 28px 0 12px;
        font-size: 20px;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .summary {
        max-width: 760px;
        font-size: 16px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 8px;
        color: #334155;
        background: var(--soft);
        font-size: 13px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: var(--soft);
      }
      .panel strong {
        display: block;
        margin-bottom: 8px;
      }
      .quick-list {
        display: grid;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .quick-list li {
        padding-left: 14px;
        border-left: 3px solid var(--blue);
        color: #334155;
        line-height: 1.5;
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .feature {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
      }
      .feature p {
        min-height: 52px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .tag {
        border-radius: 6px;
        padding: 4px 7px;
        background: #edf4ff;
        color: #1849a9;
        font-size: 12px;
      }
      .recommend {
        color: #3f4b5b;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      .consult {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 16px;
        align-items: start;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
      }
      textarea {
        min-height: 116px;
        resize: vertical;
      }
      button {
        min-height: 38px;
        margin-top: 12px;
        border: 1px solid var(--blue);
        border-radius: 6px;
        padding: 0 12px;
        color: #ffffff;
        background: var(--blue);
        font: inherit;
        font-weight: 650;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 6px;
        padding: 0 8px;
        background: #eef2f7;
        font-size: 13px;
        font-weight: 650;
      }
      .progress {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        background: #eef2f7;
      }
      .progress > div {
        min-height: 10px;
        width: 0%;
        background: var(--blue);
        transition: width 180ms ease;
      }
      #progressText {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      #recommendation {
        min-height: 220px;
        max-height: 520px;
        overflow: auto;
        white-space: pre-wrap;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
        line-height: 1.6;
      }
      #debugCommand {
        display: none;
      }
      @media (max-width: 820px) {
        header,
        .consult,
        .feature-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <section>
          <h1>Soundao 本地 Agent 入口</h1>
          <p class="summary">
            这里把 Soundao 云端的音频能力整理成本地可用入口。你可以直接浏览功能，也可以告诉
            Agent 你的职业、素材和目标，让它推荐一套更具体的方案。
          </p>
          <div class="meta">
            <span class="pill" id="fetchedAt">文档同步中</span>
            <span class="pill">本地 Web UI</span>
            <span class="pill">Python requests 调 API</span>
            <span class="pill">Agent 进度回写</span>
          </div>
        </section>
        <aside class="panel">
          <strong>不知道从哪开始？</strong>
          <ul class="quick-list" id="quickStart"></ul>
        </aside>
      </header>

      <section>
        <h2>能力菜单</h2>
        <div class="feature-grid" id="featureGrid"></div>
      </section>

      <section>
        <h2>让 Agent 帮你推荐方案</h2>
        <div class="consult">
          <form id="consultForm" class="panel">
            <label for="role">你的职业或角色</label>
            <input id="role" name="role" placeholder="例如：短视频创作者、小说作者、课程老师、播客剪辑师" />

            <label for="goal">你想完成什么</label>
            <textarea
              id="goal"
              name="goal"
              placeholder="例如：把小说片段做成多角色配音，想要自然、有情绪、可交付音频。"
            ></textarea>

            <label for="material">你已有的素材</label>
            <textarea
              id="material"
              name="material"
              placeholder="例如：有一段参考人声、2 千字脚本、需要背景音乐和音效。"
            ></textarea>

            <label for="priority">优先考虑</label>
            <select id="priority" name="priority">
              <option value="质量优先">质量优先</option>
              <option value="速度优先">速度优先</option>
              <option value="成本优先">成本优先</option>
              <option value="稳定批量">稳定批量</option>
            </select>

            <button type="submit">请 Agent 推荐方案</button>
          </form>
          <section>
            <div class="status-row">
              <span class="badge" id="agentStatus">等待咨询</span>
              <div class="progress"><div id="agentProgress"></div></div>
            </div>
            <div id="progressText">填写左侧信息后，Agent 会结合 Soundao 功能给你方案。</div>
            <div id="recommendation">推荐结果会显示在这里。</div>
            <div id="debugCommand"></div>
          </section>
        </div>
      </section>
    </main>
    <script src="/web-agent-bridge.js"></script>
    <script>
      const featureGrid = document.getElementById("featureGrid");
      const quickStart = document.getElementById("quickStart");
      const fetchedAt = document.getElementById("fetchedAt");
      const consultForm = document.getElementById("consultForm");
      const agentStatus = document.getElementById("agentStatus");
      const agentProgress = document.getElementById("agentProgress");
      const progressText = document.getElementById("progressText");
      const recommendation = document.getElementById("recommendation");
      let currentResultId = "";

      function renderFeature(feature) {
        const el = document.createElement("article");
        el.className = "feature";
        el.innerHTML = `
          <h3>${feature.title}</h3>
          <p>${feature.tagline}</p>
          <div class="tags">${feature.bestFor.map((item) => `<span class="tag">${item}</span>`).join("")}</div>
          <div class="recommend">${feature.recommended}</div>
        `;
        return el;
      }

      async function loadDocs() {
        const response = await fetch("/soundao-docs.json");
        const docs = await response.json();
        fetchedAt.textContent = `云端文档已同步：${new Date(docs.fetched_at).toLocaleString()}`;
        quickStart.innerHTML = docs.quick_start.map((item) => `<li>${item}</li>`).join("");
        featureGrid.replaceChildren(...docs.features.map(renderFeature));
        return docs;
      }

      function statusLabel(status) {
        if (status === "processing") return "分析中";
        if (status === "done") return "已生成";
        if (status === "error") return "生成失败";
        if (status === "cancelled") return "已中止";
        return "等待咨询";
      }

      function friendlyProgress(body) {
        const outcome = body.outcome || {};
        if (outcome.public_message) return outcome.public_message;
        if (body.status === "processing" && outcome.elapsed_sec) {
          return `Agent 正在分析，已运行 ${Math.round(outcome.elapsed_sec)} 秒。`;
        }
        return body.message || "Agent 正在处理。";
      }

      function cleanResult(text) {
        return String(text || "")
          .split(/\r?\n/)
          .filter((line) => !/[A-Za-z]:\\/.test(line))
          .filter((line) => !/(manifest|stderr|stdout|prompt_path|final_path|\.json|\.log)/i.test(line))
          .join("\n")
          .trim();
      }

      async function loadDeliverable(body) {
        const outcome = body.outcome || {};
        const manifest = outcome.deliverable || {};
        const primaryPath = manifest.primary_path || outcome.final_path || "";
        if (!primaryPath) {
          recommendation.textContent = cleanResult(outcome.final_preview || body.message || "");
          return;
        }
        const response = await fetch(
          `/api/agent-output?session_id=${encodeURIComponent(window.SoundaoAgentBridge.sessionId)}&path=${encodeURIComponent(primaryPath)}`,
        );
        if (!response.ok) {
          recommendation.textContent = cleanResult(outcome.final_preview || "暂时无法读取推荐结果。");
          return;
        }
        const output = await response.json();
        recommendation.textContent = cleanResult(output.content);
      }

      consultForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = new FormData(consultForm);
        const role = String(form.get("role") || "").trim() || "未说明";
        const goal = String(form.get("goal") || "").trim() || "希望了解适合自己的 Soundao 功能";
        const material = String(form.get("material") || "").trim() || "未说明";
        const priority = String(form.get("priority") || "").trim();
        const task = [
          "请结合 Soundao 云端功能文档，为用户推荐功能和解决方案。",
          `用户职业/角色：${role}`,
          `用户目标：${goal}`,
          `已有素材：${material}`,
          `优先考虑：${priority}`,
          "要求：用用户能看懂的中文输出，包含推荐功能、使用顺序、原因、需要准备的素材、下一步操作。不展示代码、JSON、本地路径或 API 原始响应。",
        ].join("\n");
        agentStatus.textContent = "已提交";
        progressText.textContent = "Agent 正在结合你的情况和 Soundao 功能文档做推荐。";
        agentProgress.style.width = "8%";
        recommendation.textContent = "";
        const saved = await window.SoundaoAgentBridge.result({
          status: "submitted",
          step: "soundao_solution_consult",
          payload: {
            action: "agent_request",
            task,
            role,
            goal,
            material,
            priority,
            source: "soundao_intro",
          },
        });
        currentResultId = saved.record?.id || "";
      });

      window.SoundaoAgentBridge.pollLatestCommand({
        intervalMs: 1000,
        onCommand(command) {
          const body = command.body || {};
          if (currentResultId && body.result_id && body.result_id !== currentResultId) return;
          agentStatus.textContent = statusLabel(body.status);
          progressText.textContent = friendlyProgress(body);
          agentProgress.style.width = `${Math.max(0, Math.min(100, Number(body.progress || 0)))}%`;
          if (body.status === "done" || body.status === "error") {
            loadDeliverable(body).catch((error) => {
              recommendation.textContent = `读取推荐结果失败：${error.message}`;
            });
          }
        },
      });

      loadDocs().catch((error) => {
        fetchedAt.textContent = "云端文档读取失败";
        quickStart.innerHTML = `<li>${error.message}</li>`;
      });
    </script>
  </body>
</html>
