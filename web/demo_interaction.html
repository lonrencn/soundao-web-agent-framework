<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent 交互演示</title>
    <style>
      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #ffffff;
        color: #1f2933;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 20px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
      }
      fieldset {
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        padding: 18px;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        padding: 10px;
        font: inherit;
      }
      textarea {
        min-height: 120px;
      }
      button {
        margin-top: 14px;
        min-height: 38px;
        border: 1px solid #1d4ed8;
        border-radius: 6px;
        padding: 0 12px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 650;
      }
      button.danger {
        display: none;
        border-color: #b42318;
        background: #d92d20;
      }
      #saved,
      #deliverable {
        margin-top: 14px;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        padding: 10px;
        background: #f9fafb;
        white-space: pre-wrap;
      }
      #deliverable {
        background: #ffffff;
      }
      #deliverable h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #deliverablePath {
        display: none;
        margin: 8px 0;
        color: #1d4ed8;
        word-break: break-all;
      }
      #deliverableContent {
        max-height: 360px;
        overflow: auto;
        border-top: 1px solid #d8dee8;
        padding-top: 10px;
      }
      #audioPlayer {
        display: none;
        width: 100%;
        margin: 10px 0;
      }
      .progress {
        margin-top: 14px;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        overflow: hidden;
        background: #eef2f7;
      }
      .progress > div {
        width: 0%;
        min-height: 10px;
        background: #2563eb;
        transition: width 160ms ease;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin-top: 14px;
        border-radius: 6px;
        padding: 0 8px;
        background: #eef2f7;
        font-size: 13px;
        font-weight: 650;
      }
      #saved,
      #agentCommand {
        display: none;
      }
      #progressText {
        margin-top: 8px;
        color: #536171;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>本地 Web 与 Agent 交互演示</h1>
      <form data-agent-result="demo_user_decision">
        <fieldset>
          <label for="voice">选择音色</label>
          <select id="voice" name="voice">
            <option value="moss_v15">MOSS v15</option>
            <option value="qwen3_design">Qwen3 Voice Design</option>
            <option value="edge_fast">Edge 快速试听</option>
          </select>
          <label for="script">你希望 Agent 下一步处理的内容</label>
          <textarea id="script" name="script">请根据这个选择继续生成一个 30 秒播客片段。</textarea>
          <label for="action">下一步处理方式</label>
          <select id="action" name="action">
            <option value="direct_tts">直接生成配音</option>
            <option value="agent_request">交给 Codex Agent 处理</option>
          </select>
          <button data-agent-action="submit_demo_choice" type="submit">保存给 Agent</button>
        </fieldset>
      </form>
      <div id="saved"></div>
      <div id="agentStatus" class="badge">等待保存</div>
      <div class="progress"><div id="agentProgress"></div></div>
      <div id="progressText">提交后这里会显示处理进度。</div>
      <button id="cancelAgent" class="danger" type="button">强制中止</button>
      <div id="deliverable">
        <h2>最终交付物</h2>
        <span id="deliverablePath">等待 Agent 生成</span>
        <audio id="audioPlayer" controls></audio>
        <div id="deliverableContent"></div>
      </div>
      <div id="agentCommand"></div>
    </main>
    <script src="/web-agent-bridge.js"></script>
    <script>
      const form = document.querySelector("form");
      const saved = document.getElementById("saved");
      const agentStatus = document.getElementById("agentStatus");
      const agentProgress = document.getElementById("agentProgress");
      const progressText = document.getElementById("progressText");
      const cancelAgent = document.getElementById("cancelAgent");
      const agentCommand = document.getElementById("agentCommand");
      const deliverablePath = document.getElementById("deliverablePath");
      const deliverableContent = document.getElementById("deliverableContent");
      const audioPlayer = document.getElementById("audioPlayer");
      let currentResultId = "";

      function resetOutput() {
        deliverablePath.textContent = "";
        deliverableContent.textContent = "";
        audioPlayer.removeAttribute("src");
        audioPlayer.style.display = "none";
      }

      function showCancelButton(show) {
        cancelAgent.style.display = show ? "inline-flex" : "none";
      }

      form.addEventListener("web-agent-saved", (event) => {
        saved.textContent = "";
        currentResultId = event.detail?.record?.id || "";
        agentStatus.textContent = "已提交";
        progressText.textContent = "已收到你的请求，正在等待 Agent 开始处理。";
        agentProgress.style.width = "5%";
        resetOutput();
        showCancelButton(true);
      });
      form.addEventListener("web-agent-error", (event) => {
        agentStatus.textContent = "提交失败";
        progressText.textContent = event.detail.message || "请稍后重试。";
        showCancelButton(false);
      });

      cancelAgent.addEventListener("click", async () => {
        const confirmed = window.confirm("要强制停止 Agent 处理吗？停止后本次过程将全部清除。");
        if (!confirmed) return;
        agentStatus.textContent = "正在中止";
        progressText.textContent = "正在强制中止 Agent，本次过程将被清除。";
        agentProgress.style.width = "0%";
        resetOutput();
        cancelAgent.disabled = true;
        try {
          const response = await fetch("/api/agent-cancel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: window.SoundaoAgentBridge.sessionId,
              result_id: currentResultId,
              reason: "User clicked force stop.",
            }),
          });
          if (!response.ok) {
            throw new Error(`中止请求失败: ${response.status}`);
          }
        } catch (error) {
          agentStatus.textContent = "中止失败";
          progressText.textContent = error.message || "请稍后重试。";
          cancelAgent.disabled = false;
        }
      });

      function statusLabel(status) {
        if (status === "stopping") return "正在中止";
        if (status === "cancelled") return "已中止";
        if (status === "processing") return "处理中";
        if (status === "done") return "已完成";
        if (status === "error") return "处理失败";
        return "等待中";
      }

      function friendlyProgress(body) {
        const outcome = body.outcome || {};
        if (outcome.public_message) {
          return outcome.public_message;
        }
        if (body.status === "processing") {
          if (outcome.elapsed_sec) {
            return `Agent 正在处理，已运行 ${Math.round(outcome.elapsed_sec)} 秒。`;
          }
          return body.message || "Agent 正在处理。";
        }
        if (body.status === "done") {
          return body.message || "结果已生成。";
        }
        if (body.status === "error") {
          return body.message || outcome.message || "处理没有成功，请调整要求后再试。";
        }
        if (body.status === "stopping") {
          return body.message || "正在强制中止 Agent，本次过程将被清除。";
        }
        if (body.status === "cancelled") {
          return body.message || "已强制中止，本次过程已清除。";
        }
        return body.message || "等待 Agent 处理。";
      }

      function userFacingContent(text, hasAudio) {
        if (hasAudio) {
          return "音频已生成，可以直接点击播放器试听。";
        }
        return String(text || "")
          .split(/\r?\n/)
          .filter((line) => {
            const value = line.trim();
            if (!value) return true;
            if (/^[`{[\]}]/.test(value)) return false;
            if (/[A-Za-z]:\\/.test(value)) return false;
            if (/(manifest|\.json|\.log|prompt_path|stderr|stdout|audio_path|final_path)/i.test(value)) {
              return false;
            }
            if (/^(相关记录|音频文件|主音频文件|文件路径|输出目录)/.test(value)) return false;
            return true;
          })
          .join("\n")
          .trim();
      }

      async function loadDeliverable(body) {
        const outcome = body.outcome || {};
        const manifest = outcome.deliverable || {};
        const primaryPath = manifest.primary_path || outcome.final_path || "";
        const files = manifest.files || [];
        const audioPath = files.find((path) => /\.(mp3|wav|m4a|ogg|flac)$/i.test(path));
        const hasAudio = Boolean(audioPath);
        if (audioPath) {
          audioPlayer.src =
            `/api/agent-file?session_id=${encodeURIComponent(window.SoundaoAgentBridge.sessionId)}&path=${encodeURIComponent(audioPath)}`;
          audioPlayer.style.display = "block";
        } else {
          audioPlayer.removeAttribute("src");
          audioPlayer.style.display = "none";
        }
        if (!primaryPath) return;
        deliverablePath.textContent = "";
        const response = await fetch(
          `/api/agent-output?session_id=${encodeURIComponent(window.SoundaoAgentBridge.sessionId)}&path=${encodeURIComponent(primaryPath)}`,
        );
        if (!response.ok) {
          deliverableContent.textContent = userFacingContent(
            body.outcome?.final_preview || "交付物已生成，但暂时无法读取内容。",
            hasAudio,
          );
          return;
        }
        const output = await response.json();
        deliverablePath.textContent = "";
        deliverableContent.textContent = userFacingContent(output.content, hasAudio);
      }

      window.SoundaoAgentBridge.pollLatestCommand({
        intervalMs: 1000,
        onCommand(command) {
          const body = command.body || {};
          const progress = Number(body.progress || 0);
          currentResultId = body.result_id || currentResultId;
          agentStatus.textContent = statusLabel(body.status);
          progressText.textContent = friendlyProgress(body);
          agentProgress.style.width = `${Math.max(0, Math.min(100, progress))}%`;
          agentCommand.textContent = "";
          showCancelButton(body.status === "processing" || body.status === "stopping");
          cancelAgent.disabled = body.status === "stopping";
          if (body.status === "stopping" || body.status === "cancelled") {
            resetOutput();
          }
          if (body.status === "done" || body.status === "error") {
            loadDeliverable(body).catch((error) => {
              deliverableContent.textContent = `读取交付物失败: ${error.message}`;
            });
          }
        },
      });
    </script>
  </body>
</html>
