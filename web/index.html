<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soundao Web Agent Bridge</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1f2933;
      }
      body {
        margin: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
        border-bottom: 1px solid #d8dee8;
        background: #ffffff;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(420px, 1fr);
        min-height: calc(100vh - 76px);
      }
      section {
        padding: 20px 24px;
      }
      .panel {
        border-right: 1px solid #d8dee8;
        background: #ffffff;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-size: 13px;
        font-weight: 650;
      }
      input,
      textarea,
      select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        padding: 10px 11px;
        font: inherit;
        background: #ffffff;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid #1d4ed8;
        border-radius: 6px;
        padding: 0 12px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }
      button.secondary,
      a.secondary {
        border-color: #c7d0dc;
        background: #ffffff;
        color: #1f2933;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      .row > * {
        flex: 1;
      }
      .status {
        margin-top: 12px;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        padding: 10px;
        min-height: 42px;
        background: #f9fafb;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .progress {
        margin-top: 12px;
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        overflow: hidden;
        background: #eef2f7;
      }
      .progress > div {
        width: 0%;
        min-height: 10px;
        background: #2563eb;
        transition: width 160ms ease;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 140px);
        border: 1px solid #c7d0dc;
        border-radius: 6px;
        background: white;
      }
      code {
        background: #eef2f7;
        border-radius: 4px;
        padding: 1px 4px;
      }
      @media (max-width: 920px) {
        main {
          grid-template-columns: 1fr;
        }
        .panel {
          border-right: 0;
          border-bottom: 1px solid #d8dee8;
        }
        iframe {
          height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Soundao Web Agent Bridge</h1>
      <div class="row" style="margin-top: 0; max-width: 360px">
        <a class="button" href="/soundao" target="_blank" rel="noreferrer">Soundao 功能入口</a>
      </div>
    </header>
    <main>
      <section class="panel">
        <h2>会话与目标页面</h2>
        <label for="sessionId">Session ID</label>
        <input id="sessionId" value="default" />
        <label for="targetUrl">本地 Web 链接</label>
        <input id="targetUrl" value="http://127.0.0.1:8765/soundao-easy" />
        <div class="row">
          <button id="loadFrame">在右侧打开</button>
          <button id="openWindow" class="secondary">新窗口打开</button>
        </div>

        <h2 style="margin-top: 26px">保存给 Agent 的结果</h2>
        <label for="step">步骤</label>
        <input id="step" value="manual_review" />
        <label for="status">状态</label>
        <select id="status">
          <option value="done">done</option>
          <option value="needs_agent">needs_agent</option>
          <option value="blocked">blocked</option>
        </select>
        <label for="payload">结果 JSON 或备注</label>
        <textarea id="payload">{"user_choice":"", "notes":""}</textarea>
        <label for="nextHint">下一步提示</label>
        <input id="nextHint" placeholder="例如：根据我选的音色生成下一段音频" />
        <div class="row">
          <button id="saveResult">保存结果</button>
          <button id="refreshLatest" class="secondary">读取最新结果</button>
        </div>
        <div id="saveStatus" class="status"></div>
        <h2 style="margin-top: 26px">Agent 进度</h2>
        <div class="progress"><div id="agentProgress"></div></div>
        <div id="agentStatus" class="status">等待保存</div>
      </section>

      <section>
        <h2>嵌入预览</h2>
        <iframe id="preview" src="/soundao-easy"></iframe>
      </section>
    </main>

    <script src="/web-agent-bridge.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);

      function targetWithSession() {
        const url = new URL($("targetUrl").value, location.href);
        url.searchParams.set("session_id", $("sessionId").value || "default");
        return url.toString();
      }

      $("loadFrame").addEventListener("click", () => {
        $("preview").src = targetWithSession();
      });

      $("openWindow").addEventListener("click", () => {
        window.open(targetWithSession(), "_blank", "noopener,noreferrer");
      });

      $("saveResult").addEventListener("click", async () => {
        let parsedPayload;
        try {
          parsedPayload = JSON.parse($("payload").value);
        } catch {
          parsedPayload = { notes: $("payload").value };
        }
        const response = await fetch("/api/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: $("sessionId").value || "default",
            step: $("step").value,
            status: $("status").value,
            payload: parsedPayload,
            next_hint: $("nextHint").value,
          }),
        });
        $("saveStatus").textContent = JSON.stringify(await response.json(), null, 2);
      });

      $("refreshLatest").addEventListener("click", async () => {
        const response = await fetch("/api/latest-result");
        $("saveStatus").textContent = JSON.stringify(await response.json(), null, 2);
      });

      async function refreshAgentStatus() {
        try {
          const response = await fetch(
            `/api/agent-command/latest?session_id=${encodeURIComponent($("sessionId").value || "default")}`,
          );
          if (!response.ok) return;
          const command = await response.json();
          const body = command.body || {};
          const progress = Number(body.progress || 0);
          $("agentProgress").style.width = `${Math.max(0, Math.min(100, progress))}%`;
          $("agentStatus").textContent = JSON.stringify(body, null, 2);
        } catch {
          // Keep the dashboard quiet while the bridge is starting.
        }
      }

      setInterval(refreshAgentStatus, 1000);
      refreshAgentStatus();
    </script>
  </body>
</html>
